<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <label class="float-switch" title="控制视频页右下角的下载悬浮按钮">
      <span>页面悬浮窗</span>
      <input id="floatToggle" type="checkbox" checked />
      <span class="slider"></span>
    </label>
    <div id="status" class="status">检测中…</div>
    <div id="main" class="hidden">
      <div id="title" class="title"></div>
      <select id="quality" class="quality"></select>
      <div class="actions">
        <button id="go" class="go" type="button">开始下载</button>
        <button id="cancel" class="cancel hidden" type="button">取消</button>
      </div>
      <div id="progress" class="progress"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
